name: CI

# Runs the same checks you'd run locally, automatically, on every push to main
# and on every pull request. A green check = this commit typechecks, lints,
# passes all tests, and builds for production. Your safety net before refactors.

on:
  push:
    branches: [main]
  pull_request:

# If you push again before a run finishes, cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
